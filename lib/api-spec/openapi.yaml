openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bruce Football Performance Diagnostics — API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Kontaktformular und Leads
  - name: stripe
    description: Stripe Webhooks und Preise
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Kontaktformular absenden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Nachricht eingegangen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResult"
        "400":
          description: Ungültige Eingabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads:
    post:
      operationId: submitLead
      tags: [contact]
      summary: Demo-Anfrage / Interessent erfassen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Demo-Anfrage eingegangen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResult"
        "400":
          description: Ungültige Eingabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /maintenance:
    get:
      operationId: getMaintenanceStatus
      tags: [health]
      summary: Gibt zurück ob die App im Wartungsmodus ist
      responses:
        "200":
          description: Wartungsstatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [stripe]
      summary: Stripe Webhook Empfänger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEventPayload"
      responses:
        "200":
          description: Webhook verarbeitet

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MaintenanceStatus:
      type: object
      properties:
        maintenance:
          type: boolean
        message:
          type: ["string", "null"]
      required:
        - maintenance

    ContactInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        subject:
          type: ["string", "null"]
        message:
          type: string
          minLength: 10
        phone:
          type: ["string", "null"]
        datenschutz:
          type: boolean

    LeadInput:
      type: object
      required: [name, email, vereinsname]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        vereinsname:
          type: string
          minLength: 2
        telefon:
          type: ["string", "null"]
        spieleranzahl:
          type: ["string", "null"]
        nachricht:
          type: ["string", "null"]
        plan:
          type: ["string", "null"]
          description: "starter | professional | enterprise"
        datenschutz:
          type: boolean

    ContactResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StripeEventPayload:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
      required:
        - type
