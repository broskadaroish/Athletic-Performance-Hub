kind = "mobile"
previewPath = "/mobile/"
title = "Athletik Mobile"
description = "Mobile companion app for football coaches to record FMS, sprint, and Y-Balance tests on the pitch, look up player profiles and athletik scores, and submit results directly from a tablet or smartphone — all synced with the main Athletik app database."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
