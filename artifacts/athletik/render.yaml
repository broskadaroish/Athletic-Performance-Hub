# ============================================================
# Render.com Deployment-Konfiguration
# Docs: https://render.com/docs/render-yaml-spec
# ============================================================

services:
  - type: web
    name: athletik-app
    env: python
    region: frankfurt         # EU-Datenschutz (alternativ: oregon, singapore)
    plan: starter             # starter | standard | pro
    branch: main

    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: bash start.sh

    # Render setzt PORT automatisch
    healthCheckPath: /_stcore/health

    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: WARNING
      - key: BEHIND_PROXY
        value: "1"
      - key: ATHLETIK_DATA_DIR
        value: /data
      - key: ATHLETIK_DB_PATH
        value: /data/athletik.db
      # Secrets über Render Dashboard setzen — NICHT hier eintragen:
      - key: SESSION_SECRET
        sync: false           # manuell im Dashboard setzen
      - key: SECRET_KEY
        sync: false
      # PostgreSQL-URL wird automatisch hinzugefügt wenn DB-Service verknüpft:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: athletik-db
      #     property: connectionString

    # Persistentes Volume für DB + Uploads + Logs
    disk:
      name: athletik-data
      mountPath: /data
      sizeGB: 5               # je nach Datenmenge anpassen

  # ── Täglicher Backup-Cron-Job ─────────────────────────────────────────────
  - type: cron
    name: athletik-backup
    env: python
    region: frankfurt
    plan: starter
    schedule: "0 2 * * *"    # täglich um 02:00 UTC
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python tools/backup.py
    envVars:
      - key: APP_ENV
        value: production
      - key: ATHLETIK_DATA_DIR
        value: /data
      - key: ATHLETIK_DB_PATH
        value: /data/athletik.db
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      # S3-Upload (optional — nur setzen wenn externer Speicher gewünscht):
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_ENDPOINT_URL
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
    disk:
      name: athletik-data      # dasselbe Volume wie der Web-Service
      mountPath: /data

# Optional: PostgreSQL-Datenbank hinzufügen (für spätere PG-Migration)
# databases:
#   - name: athletik-db
#     databaseName: athletik
#     user: athletik
#     region: frankfurt
#     plan: starter
