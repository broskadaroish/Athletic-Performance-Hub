<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <rect width="320" height="260" fill="#0d1117" rx="10"/>
  <!-- title -->
  <text x="160" y="22" fill="#c9d1d9" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Modified T-Test</text>

  <!-- cones: Start=bottom center, A=up, B=left, C=right -->
  <!-- Start / A-B-C layout: A at top, B left, C right, Start bottom -->
  <!-- A (top) -->
  <polygon points="160,60 153,75 167,75" fill="#f0883e" stroke="#ffa657" stroke-width="1.5"/>
  <text x="160" y="88" fill="#ffa657" font-family="Arial" font-size="11" text-anchor="middle">A</text>
  <!-- B (left) -->
  <polygon points="80,140 73,155 87,155" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="80" y="168" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">B</text>
  <!-- C (right) -->
  <polygon points="240,140 233,155 247,155" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="240" y="168" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">C</text>
  <!-- Start -->
  <polygon points="160,195 153,210 167,210" fill="#3fb950" stroke="#56d364" stroke-width="1.5"/>
  <text x="160" y="223" fill="#56d364" font-family="Arial" font-size="11" text-anchor="middle">Start/Ziel</text>

  <!-- Lines: Start→A, A→B, B→C, C→A, A→Start -->
  <line x1="160" y1="195" x2="160" y2="75" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="160" y1="75" x2="80" y2="155" stroke="#f0883e" stroke-width="2"/>
  <line x1="80" y1="155" x2="240" y2="155" stroke="#f0883e" stroke-width="2"/>
  <line x1="240" y1="155" x2="160" y2="75" stroke="#f0883e" stroke-width="2"/>
  <line x1="160" y1="75" x2="160" y2="195" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- distances -->
  <text x="175" y="140" fill="#8b949e" font-family="Arial" font-size="10">9.15m</text>
  <text x="130" y="150" fill="#8b949e" font-family="Arial" font-size="10">3.66m</text>
  <text x="200" y="150" fill="#8b949e" font-family="Arial" font-size="10">3.66m</text>

  <!-- direction arrows -->
  <text x="160" y="248" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">Start → A → B → C → A → Start</text>
</svg>
