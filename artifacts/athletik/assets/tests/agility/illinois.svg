<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240"
     style="width:100%;max-width:360px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Illinois Agility Run: 10 m × 5 m Parcours mit 8 Hütchen, Slalomkurs durch 4 Mittelkegel">
  <rect width="360" height="240" rx="8" fill="#161b22"/>
  <text x="180" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Illinois Agility Run</text>

  <!-- Layout: 10 m long (horizontal) × 5 m wide (vertical)
       Scale: 10 m = 260 px → 1 m = 26 px
       Start: left (x=50), Finish: right (x=310)
       Top row y=60, Bottom row y=180, center y=120
       Corner cones: (50,60) (50,180) (310,60) (310,180)
       Center cones (4 pieces) at x = 50+26*2.5=115, 141, 167, 193... 
       Actually: cones spaced evenly, 4 cones at 10m/5 = at 2m, 4m, 6m, 8m from start
       x positions: 50 + 2*26=102, 50+4*26=154, 50+6*26=206, 50+8*26=258
       Center y = 120
  -->

  <defs>
    <marker id="il-arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#d29922"/>
    </marker>
  </defs>

  <!-- Corner cones -->
  <!-- Start (top-left) -->
  <polygon points="50,50 58,66 42,66" fill="#3fb950" opacity="0.9"/>
  <text x="50" y="78" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Start</text>

  <!-- TL2 (bottom-left) -->
  <polygon points="50,160 58,176 42,176" fill="#58a6ff" opacity="0.7"/>

  <!-- TR (top-right) -->
  <polygon points="310,50 318,66 302,66" fill="#58a6ff" opacity="0.7"/>

  <!-- Finish (bottom-right) -->
  <polygon points="310,160 318,176 302,176" fill="#f0883e" opacity="0.9"/>
  <text x="310" y="188" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Finish</text>

  <!-- Rectangle outline -->
  <rect x="50" y="60" width="260" height="110" rx="0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Center slalom cones (4 cones at 2m, 4m, 6m, 8m) at center y=115 -->
  <polygon points="102,106 109,122 95,122" fill="#d29922" opacity="0.9"/>
  <polygon points="154,106 161,122 147,122" fill="#d29922" opacity="0.9"/>
  <polygon points="206,106 213,122 199,122" fill="#d29922" opacity="0.9"/>
  <polygon points="258,106 265,122 251,122" fill="#d29922" opacity="0.9"/>
  <!-- cone labels -->
  <text x="102" y="130" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">1</text>
  <text x="154" y="130" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">2</text>
  <text x="206" y="130" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">3</text>
  <text x="258" y="130" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">4</text>

  <!-- === MOVEMENT PATH === -->
  <!-- 1: Start (top-left) → Sprint to bottom-left -->
  <line x1="50" y1="66" x2="50" y2="160" stroke="#d29922" stroke-width="2" marker-end="url(#il-arr)"/>

  <!-- 2: Sprint bottom-left → bottom-right corner -->
  <line x1="50" y1="170" x2="310" y2="170" stroke="#d29922" stroke-width="2" marker-end="url(#il-arr)"/>

  <!-- 3: Sprint bottom-right → top-right corner -->
  <line x1="310" y1="170" x2="310" y2="66" stroke="#d29922" stroke-width="2" marker-end="url(#il-arr)"/>

  <!-- 4: Slalom through center cones: top-right → zigzag left through cones → finish (bottom-right) -->
  <!-- Path: (310,60) → slalom in from right to left, alternating above/below cones → end at (310,170) already done... -->
  <!-- Actually Illinois: start top-left, sprint bottom, sprint right, sprint up top-right, then slalom left through 4 cones, sprint bottom-left, finish bottom-left... -->
  <!-- Standard: Start top-left → sprint to bottom-left → sprint to bottom-right → sprint to top-right → slalom through 4 center cones (right→left) → sprint from bottom end to finish (bottom-left)? -->
  <!-- Let me use: Start(TL) → TBL → TBR → TTR → slalom through 4 cones → TBL (=Finish) -->
  <!-- Slalom path from top-right (310,60) through cones: cone4(258,115) → cone3(206,115) → cone2(154,115) → cone1(102,115) → bottom-left(50,170)=Finish -->
  <!-- The slalom goes in S shape: right to left, alternating above-below each cone -->
  <path d="M310,60 Q290,80 258,106 Q230,130 206,106 Q182,82 154,106 Q126,130 102,106 Q76,82 50,170"
        fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#il-arr)"/>

  <!-- Step numbers overlay -->
  <text x="36" y="113" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">①</text>
  <text x="170" y="193" fill="#d29922" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">②</text>
  <text x="323" y="113" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">③</text>
  <text x="185" y="95" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">④ Slalom</text>

  <!-- Dimensions -->
  <!-- 10 m -->
  <line x1="50" y1="206" x2="310" y2="206" stroke="#8b949e" stroke-width="1"/>
  <line x1="50" y1="200" x2="50" y2="212" stroke="#8b949e" stroke-width="1"/>
  <line x1="310" y1="200" x2="310" y2="212" stroke="#8b949e" stroke-width="1"/>
  <text x="180" y="216" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">10 m</text>

  <!-- 5 m -->
  <line x1="330" y1="60" x2="330" y2="170" stroke="#8b949e" stroke-width="1"/>
  <line x1="324" y1="60" x2="336" y2="60" stroke="#8b949e" stroke-width="1"/>
  <line x1="324" y1="170" x2="336" y2="170" stroke="#8b949e" stroke-width="1"/>
  <text x="347" y="115" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">5 m</text>

  <!-- cone spacing -->
  <text x="180" y="143" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Kegelabstand: 2 m</text>

  <rect x="10" y="222" width="340" height="14" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="180" y="232" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Alle Hütchen müssen umrundet werden · Zeitmessung ab erstem Schritt</text>
</svg>
