<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#0d1117" rx="10"/>
  <text x="160" y="22" fill="#c9d1d9" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Pro Agility Shuttle (5-10-5)</text>

  <!-- 3 Hütchen horizontal: links (A), Mitte/Start (B), rechts (C) -->
  <!-- A links -->
  <polygon points="50,110 43,125 57,125" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="50" y="138" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">A</text>
  <text x="50" y="150" fill="#8b949e" font-family="Arial" font-size="9" text-anchor="middle">5 yd</text>

  <!-- B Mitte/Start -->
  <polygon points="160,110 153,125 167,125" fill="#3fb950" stroke="#56d364" stroke-width="1.5"/>
  <text x="160" y="138" fill="#56d364" font-family="Arial" font-size="11" text-anchor="middle">Start</text>

  <!-- C rechts -->
  <polygon points="270,110 263,125 277,125" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="270" y="138" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">C</text>
  <text x="270" y="150" fill="#8b949e" font-family="Arial" font-size="9" text-anchor="middle">5 yd</text>

  <!-- Basislinie -->
  <line x1="50" y1="122" x2="270" y2="122" stroke="#30363d" stroke-width="1"/>

  <!-- Pfeile: B→A -->
  <path d="M155,108 Q105,80 55,108" stroke="#f0883e" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <!-- A→C -->
  <path d="M55,112 Q160,145 265,112" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <!-- C→B -->
  <path d="M265,108 Q215,75 165,108" stroke="#a371f7" stroke-width="2" fill="none" marker-end="url(#arr3)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f0883e"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a371f7"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="100" y="72" fill="#f0883e" font-family="Arial" font-size="10" text-anchor="middle">① 5 yd links</text>
  <text x="160" y="160" fill="#3fb950" font-family="Arial" font-size="10" text-anchor="middle">② 10 yd rechts</text>
  <text x="215" y="72" fill="#a371f7" font-family="Arial" font-size="10" text-anchor="middle">③ 5 yd zurück</text>

  <text x="160" y="185" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">Gesamtstrecke: 20 yd — Startrichtung wählbar</text>
</svg>
