<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="320" height="240" fill="#0d1117" rx="10"/>
  <text x="160" y="22" fill="#c9d1d9" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Zig-Zag Agility Test</text>

  <!-- 5 Kegel in Zickzack: Start links unten, K1 rechts, K2 links, K3 rechts, Ziel links unten -->
  <!-- Start -->
  <polygon points="55,190 48,205 62,205" fill="#3fb950" stroke="#56d364" stroke-width="1.5"/>
  <text x="55" y="218" fill="#56d364" font-family="Arial" font-size="11" text-anchor="middle">Start</text>

  <!-- K1 -->
  <polygon points="130,120 123,135 137,135" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="130" y="148" fill="#79c0ff" font-family="Arial" font-size="10" text-anchor="middle">1</text>

  <!-- K2 (oben links) -->
  <polygon points="75,65 68,80 82,80" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="75" y="93" fill="#79c0ff" font-family="Arial" font-size="10" text-anchor="middle">2</text>

  <!-- K3 -->
  <polygon points="200,65 193,80 207,80" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="200" y="93" fill="#79c0ff" font-family="Arial" font-size="10" text-anchor="middle">3</text>

  <!-- K4 -->
  <polygon points="250,130 243,145 257,145" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="250" y="158" fill="#79c0ff" font-family="Arial" font-size="10" text-anchor="middle">4</text>

  <!-- Ziel -->
  <polygon points="265,190 258,205 272,205" fill="#f0883e" stroke="#ffa657" stroke-width="1.5"/>
  <text x="265" y="218" fill="#ffa657" font-family="Arial" font-size="11" text-anchor="middle">Ziel</text>

  <!-- Zickzack-Pfad -->
  <polyline points="55,190 130,128 75,73 200,73 250,138 265,190" stroke="#f0883e" stroke-width="2.5" fill="none"/>

  <!-- Distanz-Annotations -->
  <text x="87" y="170" fill="#8b949e" font-family="Arial" font-size="9">~5m</text>
  <text x="88" y="100" fill="#8b949e" font-family="Arial" font-size="9">~5m</text>
  <text x="130" y="65" fill="#8b949e" font-family="Arial" font-size="9">~5m</text>
  <text x="215" y="110" fill="#8b949e" font-family="Arial" font-size="9">~5m</text>

  <text x="160" y="235" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">Gesamtstrecke je nach Protokoll 20–25 m</text>
</svg>
