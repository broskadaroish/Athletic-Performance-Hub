<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <rect width="320" height="260" fill="#0d1117" rx="10"/>
  <text x="160" y="22" fill="#c9d1d9" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Balsom Agility Test</text>

  <!-- Rechteck 4×4m, 4 Außen-Eckkegel + 1 Mittelpunkt -->
  <!-- Äußeres Rechteck: TL, TR, BR, BL — plus Mittelpunkt -->
  <!-- Koordinaten: TL(70,65) TR(250,65) BR(250,175) BL(70,175) Mitte(160,120) -->

  <!-- Rechteck Linien -->
  <rect x="70" y="65" width="180" height="110" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- TL -->
  <polygon points="70,65 63,80 77,80" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="60" y="93" fill="#79c0ff" font-family="Arial" font-size="10">A</text>

  <!-- TR -->
  <polygon points="250,65 243,80 257,80" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="255" y="93" fill="#79c0ff" font-family="Arial" font-size="10">B</text>

  <!-- BR -->
  <polygon points="250,175 243,190 257,190" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="255" y="203" fill="#79c0ff" font-family="Arial" font-size="10">C</text>

  <!-- BL -->
  <polygon points="70,175 63,190 77,190" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="55" y="203" fill="#79c0ff" font-family="Arial" font-size="10">D</text>

  <!-- Mittelpunkt E -->
  <circle cx="160" cy="120" r="5" fill="#f0883e" stroke="#ffa657" stroke-width="2"/>
  <text x="168" y="124" fill="#ffa657" font-family="Arial" font-size="10">E (Mitte)</text>

  <!-- Startlinie unten -->
  <line x1="70" y1="215" x2="250" y2="215" stroke="#3fb950" stroke-width="2"/>
  <text x="160" y="228" fill="#56d364" font-family="Arial" font-size="11" text-anchor="middle">Start / Ziel</text>

  <!-- Distanz-Labels -->
  <text x="155" y="60" fill="#8b949e" font-family="Arial" font-size="9" text-anchor="middle">4 m</text>
  <text x="40" y="125" fill="#8b949e" font-family="Arial" font-size="9" text-anchor="middle">4 m</text>

  <!-- Pfeil-Andeutung -->
  <path d="M160,215 Q70,190 70,80" stroke="#f0883e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M70,80 Q160,65 250,80" stroke="#f0883e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <text x="160" y="248" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">3 Läufe à 25 s — Anzahl Richtungswechsel zählen</text>
</svg>
