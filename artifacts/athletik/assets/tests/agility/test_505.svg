<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190"
     style="width:100%;max-width:620px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="505-Test Aufbau: 10 Meter Anlaufzone, 5 Meter Zeitmesszone, 180 Grad Wendepunkt">
  <rect width="620" height="190" rx="8" fill="#161b22"/>
  <text x="310" y="22" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">505-Test — Testaufbau</text>

  <!-- Track background -->
  <rect x="30" y="45" width="560" height="80" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>

  <!-- Start line (right side) -->
  <line x1="560" y1="38" x2="560" y2="132" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="560" y="148" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Start / Ziel</text>

  <!-- 5m zone boundary (Zeitmesstor) x = 560 - 5*scale -->
  <!-- Total 15m shown: 10m anlauf + 5m zeitmess. Scale = 560/15 = 37.3 px/m; 5m = 187px; 10m = 373px -->
  <!-- Let's place start at x=590 (right), 5m zone boundary at x=590-185=405, 10m (full) at x=590-373=217, wall at x=217 -->
  <!-- Adjust: start=570, 5m=570-180=390, 10m marker=570-360=210, wendepunkt=30+20=50 -->

  <!-- 5m-Zone boundary (Zeitmesstor) -->
  <line x1="390" y1="38" x2="390" y2="132" stroke="#f0883e" stroke-width="2"/>
  <rect x="386" y="38" width="8" height="12" rx="2" fill="#f0883e"/>
  <rect x="386" y="118" width="8" height="12" rx="2" fill="#f0883e"/>
  <text x="390" y="148" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10">Zeitmesstor</text>
  <text x="390" y="158" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10">(5 m vor Wende)</text>

  <!-- Wendepunkt / Wendeline (left) -->
  <line x1="60" y1="38" x2="60" y2="132" stroke="#ff7b72" stroke-width="3"/>
  <text x="60" y="148" text-anchor="middle" fill="#ff7b72" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Wendepunkt</text>
  <!-- Cone -->
  <polygon points="60,38  54,52  66,52" fill="#ff7b72" opacity="0.9"/>
  <polygon points="60,130 54,118 66,118" fill="#ff7b72" opacity="0.9"/>

  <!-- Laufrichtung: hinlaufen (right to left, top lane) -->
  <defs>
    <marker id="arr-l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#58a6ff" opacity="0.7"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" opacity="0.7"/>
    </marker>
  </defs>
  <!-- Hin (top): right → left -->
  <line x1="555" y1="72" x2="70" y2="72" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="8,3" marker-end="url(#arr-l)"/>
  <text x="312" y="68" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="10" opacity="0.9">→ Hinlaufen (10 m Anlauf)</text>

  <!-- Return (bottom): left → right -->
  <line x1="65" y1="100" x2="555" y2="100" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="8,3" marker-end="url(#arr-r)"/>
  <text x="312" y="114" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="10" opacity="0.9">← Zurücksprinten (5 m gestoppt)</text>

  <!-- Zone labels -->
  <!-- 10m Anlaufzone -->
  <text x="480" y="58" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">10 m</text>
  <text x="480" y="68" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Anlauf</text>
  <!-- 5m Zeitmesszone -->
  <text x="224" y="58" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10">5 m</text>
  <text x="224" y="68" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10">Zeitmessung</text>

  <!-- Athlete silhouette at start -->
  <circle cx="574" cy="62" r="6" fill="#58a6ff" opacity="0.8"/>
  <line x1="574" y1="68" x2="574" y2="86" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
  <line x1="568" y1="74" x2="580" y2="74" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="574" y1="86" x2="568" y2="100" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="574" y1="86" x2="580" y2="100" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>

  <!-- Legend -->
  <rect x="30" y="162" width="560" height="22" rx="3" fill="#21262d" opacity="0.7"/>
  <rect x="50" y="169" width="12" height="8" rx="1" fill="#f0883e"/>
  <text x="66" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Zeitmesstor / Lichtschranke</text>
  <polygon points="210,170  204,178  216,178" fill="#ff7b72"/>
  <text x="220" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Wendehütchen</text>
  <line x1="350" y1="173" x2="375" y2="173" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="380" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Hinlaufen</text>
  <line x1="455" y1="173" x2="480" y2="173" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="485" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Zurück</text>
</svg>
