<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270">
  <rect width="320" height="270" fill="#0d1117" rx="10"/>
  <text x="160" y="22" fill="#c9d1d9" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Arrowhead Agility Test</text>

  <!-- Kegel: Start (unten Mitte), L (links), R (rechts), Spitze oben Mitte, Ziel = Start -->
  <!-- Spitze A oben -->
  <polygon points="160,55 153,70 167,70" fill="#ffa657" stroke="#f0883e" stroke-width="1.5"/>
  <text x="160" y="82" fill="#ffa657" font-family="Arial" font-size="11" text-anchor="middle">A</text>

  <!-- Links B -->
  <polygon points="75,155 68,170 82,170" fill="#79c0ff" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="75" y="183" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">B (L)</text>

  <!-- Rechts C -->
  <polygon points="245,155 238,170 252,170" fill="#79c0ff" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="245" y="183" fill="#79c0ff" font-family="Arial" font-size="11" text-anchor="middle">C (R)</text>

  <!-- Start/Ziel unten Mitte -->
  <polygon points="160,205 153,220 167,220" fill="#3fb950" stroke="#56d364" stroke-width="1.5"/>
  <text x="160" y="233" fill="#56d364" font-family="Arial" font-size="11" text-anchor="middle">Start / Ziel</text>

  <!-- Pfade: Rechts-Variante: Start→A→C→Start -->
  <line x1="160" y1="205" x2="160" y2="70" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="160" y1="70" x2="245" y2="170" stroke="#f0883e" stroke-width="2"/>
  <line x1="245" y1="170" x2="160" y2="205" stroke="#f0883e" stroke-width="2"/>

  <!-- Links-Variante: Start→A→B→Start -->
  <line x1="160" y1="70" x2="75" y2="170" stroke="#79c0ff" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="75" y1="170" x2="160" y2="205" stroke="#79c0ff" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Distanz-Labels -->
  <text x="172" y="145" fill="#8b949e" font-family="Arial" font-size="10">~10m</text>
  <text x="210" y="198" fill="#f0883e" font-family="Arial" font-size="10">Rechts</text>
  <text x="95" y="198" fill="#79c0ff" font-family="Arial" font-size="10">Links</text>

  <text x="160" y="255" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">R und L separat messen — je 1 Versuch</text>
</svg>
