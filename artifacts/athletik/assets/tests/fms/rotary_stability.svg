<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190"
     style="width:100%;max-width:380px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Rotary Stability: Vierfüßlerstand, Arm und Gegenbein gleichzeitig strecken ohne Rotation">
  <rect width="380" height="190" rx="8" fill="#161b22"/>
  <text x="190" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">7 · Rotary Stability</text>

  <!-- Floor line -->
  <line x1="20" y1="152" x2="360" y2="152" stroke="#30363d" stroke-width="1.5"/>

  <!-- Board under figure -->
  <rect x="60" y="149" width="220" height="5" rx="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>

  <!-- Vierfüßlerstand figure -->
  <!-- Head -->
  <circle cx="300" cy="80" r="9" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Torso -->
  <line x1="291" y1="80" x2="140" y2="100" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Support arm (left/front, goes to floor) -->
  <line x1="240" y1="87" x2="230" y2="120" stroke="#58a6ff" stroke-width="2"/>
  <line x1="230" y1="120" x2="218" y2="148" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="205" y="165" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Stützhand</text>

  <!-- Support knee (right/back, on floor) -->
  <line x1="155" y1="97" x2="155" y2="130" stroke="#58a6ff" stroke-width="2"/>
  <line x1="155" y1="130" x2="168" y2="148" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="168" y="165" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Stützknie</text>

  <!-- RAISED arm (right, extended forward) -->
  <line x1="285" y1="84" x2="360" y2="75" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <text x="362" y="71" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">Arm</text>
  <text x="362" y="81" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">(vor)</text>

  <!-- RAISED leg (left, extended backward) -->
  <line x1="140" y1="100" x2="65" y2="115" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>
  <text x="28" y="110" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">Bein</text>
  <text x="28" y="120" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">(hint.)</text>

  <!-- Diagonal arrow showing arm-opposite-leg -->
  <line x1="360" y1="75" x2="65" y2="115" stroke="#d29922" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="210" y="82" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">diagonal</text>

  <!-- No-rotation indicator -->
  <circle cx="215" cy="98" r="12" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="207" y1="90" x2="223" y2="106" stroke="#f85149" stroke-width="1.5"/>
  <text x="215" y="128" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="8">keine Rotation!</text>

  <rect x="10" y="162" width="360" height="22" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="190" y="172" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">3 = diagonal (Arm rechts + Bein links gleichzeitig)</text>
  <text x="190" y="182" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">2 = unilateral · 1 = nicht möglich · 0 = Schmerzen</text>
</svg>
