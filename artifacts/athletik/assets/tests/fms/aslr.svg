<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190"
     style="width:100%;max-width:380px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="ASLR Active Straight Leg Raise: Spieler liegt, hebt gestrecktes Bein">
  <rect width="380" height="190" rx="8" fill="#161b22"/>
  <text x="190" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">5 · ASLR — Active Straight Leg Raise</text>

  <!-- Floor line -->
  <line x1="20" y1="145" x2="360" y2="145" stroke="#30363d" stroke-width="2"/>

  <!-- Figure lying on back -->
  <!-- Head -->
  <circle cx="320" cy="130" r="12" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Body -->
  <line x1="308" y1="130" x2="80" y2="130" stroke="#58a6ff" stroke-width="3"/>
  <!-- Stationary leg (right, flat on floor) -->
  <line x1="80" y1="130" x2="40" y2="140" stroke="#8b949e" stroke-width="2.5"/>
  <text x="30" y="158" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Standbein</text>
  <text x="30" y="168" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">am Boden</text>

  <!-- Raised leg (left, lifted to ~70°) -->
  <line x1="110" y1="130" x2="85" y2="58" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="52" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">Bein</text>
  <text x="66" y="62" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">gestreckt</text>

  <!-- Measurement reference lines -->
  <!-- ASIS point marker -->
  <circle cx="130" cy="130" r="4" fill="#d29922"/>
  <text x="132" y="120" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">ASIS</text>
  <!-- Knie marker (stationary leg) -->
  <circle cx="60" cy="137" r="4" fill="#f0883e"/>
  <text x="62" y="132" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">Knie</text>

  <!-- Vertical reference line from ASIS -->
  <line x1="130" y1="50" x2="130" y2="144" stroke="#d29922" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Angle arc -->
  <path d="M 110 100 A 30 30 0 0 1 130 130" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="142" y="108" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9">Höhe?</text>

  <!-- Score zones -->
  <rect x="200" y="40" width="160" height="90" rx="4" fill="#21262d"/>
  <text x="280" y="57" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Bewertung</text>
  <line x1="210" y1="63" x2="350" y2="63" stroke="#30363d" stroke-width="1"/>
  <circle cx="220" cy="75" r="4" fill="#3fb950"/>
  <text x="228" y="79" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">3 = über ASIS-Mitte</text>
  <circle cx="220" cy="92" r="4" fill="#d29922"/>
  <text x="228" y="96" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">2 = zw. ASIS und Knie</text>
  <circle cx="220" cy="109" r="4" fill="#f85149"/>
  <text x="228" y="113" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">1 = unter Kniehöhe</text>

  <rect x="10" y="168" width="360" height="16" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="190" y="180" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Standbein bleibt flach am Boden · Knie gestreckt · je Seite bewerten</text>
</svg>
