<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190"
     style="width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Inline Lunge: Ausfallschritt auf einer Linie mit Stab hinter dem Rücken">
  <rect width="340" height="190" rx="8" fill="#161b22"/>
  <text x="170" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">3 · Inline Lunge</text>

  <!-- Board / Linie -->
  <rect x="60" y="147" width="220" height="6" rx="2" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
  <text x="170" y="165" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9">FMS-Brett / Linie</text>

  <!-- Boden -->
  <line x1="20" y1="153" x2="320" y2="153" stroke="#21262d" stroke-width="1"/>

  <!-- Spieler im Ausfallschritt -->
  <!-- Kopf -->
  <circle cx="155" cy="44" r="9" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Rumpf aufrecht -->
  <line x1="155" y1="53" x2="155" y2="95" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Stab vertikal hinter Rücken -->
  <line x1="162" y1="30" x2="162" y2="153" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="176" y="95" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">Stab</text>

  <!-- Vorderbein (links, Knie ~90°) -->
  <line x1="155" y1="95" x2="140" y2="120" stroke="#58a6ff" stroke-width="2"/>
  <line x1="140" y1="120" x2="130" y2="147" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Hinterbein (rechts, gekniet) -->
  <line x1="155" y1="95" x2="185" y2="118" stroke="#3fb950" stroke-width="2"/>
  <line x1="185" y1="118" x2="200" y2="147" stroke="#3fb950" stroke-width="2.5"/>

  <!-- Knee angle indicator -->
  <path d="M 133 125 A 12 12 0 0 1 147 114" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="120" y="130" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">~90°</text>

  <!-- Arms holding stab (behind back implied) -->
  <line x1="155" y1="72" x2="145" y2="80" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="155" y1="72" x2="162" y2="68" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="122" y="143" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9">Vorderbein</text>
  <text x="208" y="143" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">Hinterbein</text>

  <!-- L+R note -->
  <rect x="240" y="50" width="80" height="50" rx="4" fill="#21262d"/>
  <text x="280" y="68" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">je Seite</text>
  <text x="280" y="80" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">bewertet</text>
  <text x="280" y="92" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">L + R</text>

  <rect x="10" y="170" width="320" height="16" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="170" y="182" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">3 = korrekt · 2 = Kompensation (Stab kippt) · 1 = nicht möglich · 0 = Schmerzen</text>
</svg>
