<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190"
     style="width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Deep Squat: Ausgangsposition stehend mit Stab über Kopf, Endposition tiefe Kniebeuge">
  <rect width="340" height="190" rx="8" fill="#161b22"/>
  <text x="170" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">1 · Deep Squat</text>

  <!-- LEFT: Ausgangsposition -->
  <text x="72" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Ausgangsposition</text>
  <!-- Stab -->
  <line x1="44" y1="52" x2="100" y2="52" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>
  <!-- Arme -->
  <line x1="52" y1="68" x2="44" y2="54" stroke="#58a6ff" stroke-width="2"/>
  <line x1="92" y1="68" x2="100" y2="54" stroke="#58a6ff" stroke-width="2"/>
  <!-- Kopf -->
  <circle cx="72" cy="64" r="9" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Rumpf -->
  <line x1="72" y1="73" x2="72" y2="110" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Beine gerade -->
  <line x1="72" y1="110" x2="62" y2="145" stroke="#58a6ff" stroke-width="2"/>
  <line x1="72" y1="110" x2="82" y2="145" stroke="#58a6ff" stroke-width="2"/>
  <!-- Füße -->
  <line x1="62" y1="145" x2="50" y2="148" stroke="#58a6ff" stroke-width="2"/>
  <line x1="82" y1="145" x2="94" y2="148" stroke="#58a6ff" stroke-width="2"/>
  <!-- Boden -->
  <line x1="30" y1="150" x2="114" y2="150" stroke="#30363d" stroke-width="1.5"/>

  <!-- Arrow center -->
  <text x="170" y="100" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="22">→</text>

  <!-- RIGHT: Tiefe Kniebeuge -->
  <text x="268" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Tiefe Kniebeuge</text>
  <!-- Stab (still overhead) -->
  <line x1="238" y1="48" x2="298" y2="48" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>
  <!-- Arme schräg weit -->
  <line x1="252" y1="65" x2="240" y2="50" stroke="#58a6ff" stroke-width="2"/>
  <line x1="285" y1="65" x2="297" y2="50" stroke="#58a6ff" stroke-width="2"/>
  <!-- Kopf -->
  <circle cx="268" cy="62" r="9" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Rumpf gebeugt -->
  <line x1="268" y1="71" x2="268" y2="100" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Oberschenkel waagrecht -->
  <line x1="268" y1="100" x2="248" y2="125" stroke="#58a6ff" stroke-width="2"/>
  <line x1="268" y1="100" x2="288" y2="125" stroke="#58a6ff" stroke-width="2"/>
  <!-- Unterschenkel -->
  <line x1="248" y1="125" x2="244" y2="150" stroke="#58a6ff" stroke-width="2"/>
  <line x1="288" y1="125" x2="292" y2="150" stroke="#58a6ff" stroke-width="2"/>
  <!-- Füße -->
  <line x1="244" y1="150" x2="232" y2="153" stroke="#58a6ff" stroke-width="2"/>
  <line x1="292" y1="150" x2="304" y2="153" stroke="#58a6ff" stroke-width="2"/>
  <!-- Boden -->
  <line x1="226" y1="155" x2="310" y2="155" stroke="#30363d" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="268" y="170" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">Knie über Zehen · Fersen am Boden</text>

  <!-- Stab label -->
  <text x="72" y="48" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">Stab</text>
  <text x="268" y="44" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="9">Stab</text>

  <!-- Score hint -->
  <rect x="10" y="164" width="320" height="20" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="170" y="178" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">3 = vollständig · 2 = Fersenkeil nötig · 1 = nicht möglich · 0 = Schmerzen</text>
</svg>
