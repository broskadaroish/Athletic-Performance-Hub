<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190"
     style="width:100%;max-width:380px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Trunk Stability Push-up: Liegestütz mit geradem Körper — Hüfte darf nicht absacken">
  <rect width="380" height="190" rx="8" fill="#161b22"/>
  <text x="190" y="18" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">6 · Trunk Stability Push-up</text>

  <!-- Floor line -->
  <line x1="20" y1="155" x2="360" y2="155" stroke="#30363d" stroke-width="1.5"/>

  <!-- LEFT: CORRECT (3 Punkte) -->
  <text x="100" y="36" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="10" font-weight="600">✓ Korrekt (3)</text>

  <!-- Figure in push-up position — straight body -->
  <!-- Head -->
  <circle cx="298" cy="80" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
  <!-- Body (straight line) -->
  <line x1="289" y1="80" x2="60" y2="110" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms pushing up -->
  <line x1="250" y1="86" x2="248" y2="110" stroke="#3fb950" stroke-width="2"/>
  <line x1="248" y1="110" x2="236" y2="110" stroke="#3fb950" stroke-width="2"/>
  <line x1="200" y1="93" x2="198" y2="117" stroke="#3fb950" stroke-width="2"/>
  <line x1="198" y1="117" x2="186" y2="117" stroke="#3fb950" stroke-width="2"/>

  <!-- Hands on floor -->
  <line x1="60" y1="110" x2="48" y2="140" stroke="#3fb950" stroke-width="2"/>
  <line x1="48" y1="140" x2="36" y2="143" stroke="#3fb950" stroke-width="2"/>
  <line x1="60" y1="110" x2="72" y2="140" stroke="#3fb950" stroke-width="2"/>
  <line x1="72" y1="140" x2="84" y2="143" stroke="#3fb950" stroke-width="2"/>

  <!-- Straight body line -->
  <line x1="60" y1="106" x2="295" y2="76" stroke="#3fb950" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Thumb/chin reference markers -->
  <text x="310" y="72" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">Daumen</text>
  <text x="310" y="82" fill="#d29922" font-family="system-ui,sans-serif" font-size="9">= Stirnhöhe</text>
  <text x="310" y="92" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">(Männer: 3)</text>
  <text x="310" y="102" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">(Frauen: Kinn)</text>

  <!-- RIGHT: WRONG (hip sag) -->
  <text x="100" y="60" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="9">Fehler: Hüfte absackt</text>

  <!-- Wrong figure (hips low) -->
  <circle cx="298" cy="105" r="7" fill="none" stroke="#f85149" stroke-width="1.5" opacity="0.5"/>
  <path d="M 289 105 Q 180 135 60 130" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <!-- Hüfte absackt marker -->
  <circle cx="175" cy="131" r="5" fill="#f85149" opacity="0.7"/>
  <text x="155" y="148" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="9">Hüfte tiefer!</text>

  <rect x="10" y="164" width="360" height="20" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="190" y="172" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Körperlinie muss komplett gerade sein.</text>
  <text x="190" y="181" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Männer: Daumen Stirnhöhe=3, Kinnhöhe=2 · Frauen: Kinnhöhe=3, Schlüsselbein=2</text>
</svg>
