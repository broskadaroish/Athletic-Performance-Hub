<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220"
     style="width:100%;max-width:360px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="CMJ einbeinig: Start auf einem Bein, Gegenbewegung, Absprung und Landung auf demselben Bein">
  <rect width="360" height="220" rx="8" fill="#161b22"/>
  <text x="180" y="16" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">CMJ einbeinig — Seitenvergleich R/L</text>

  <defs>
    <marker id="ce-up" markerWidth="7" markerHeight="6" refX="3.5" refY="0" orient="auto">
      <polygon points="0,6 3.5,0 7,6" fill="#3fb950"/>
    </marker>
    <marker id="ce-r" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#8b949e"/>
    </marker>
    <marker id="ce-l" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <polygon points="0 0,7 2.5,0 5" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Ground -->
  <line x1="30" y1="175" x2="330" y2="175" stroke="#30363d" stroke-width="2"/>

  <!-- === LEFT: START POSITION (one leg, slight countermovement) === -->
  <text x="85" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" font-weight="600">START — EIN BEIN</text>
  <!-- Head -->
  <circle cx="85" cy="70" r="8" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Torso slightly bent -->
  <line x1="85" y1="78" x2="88" y2="115" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms on hips -->
  <line x1="73" y1="96" x2="86" y2="94" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="86" y1="94" x2="100" y2="96" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hip -->
  <circle cx="88" cy="115" r="3" fill="#58a6ff"/>
  <!-- Standing leg bent (countermovement) -->
  <line x1="88" y1="115" x2="80" y2="145" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="145" x2="84" y2="175" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Foot on ground -->
  <line x1="76" y1="175" x2="94" y2="175" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Free leg lifted behind (bent, never touches) -->
  <line x1="88" y1="115" x2="106" y2="132" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>
  <line x1="106" y1="132" x2="112" y2="152" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>
  <text x="122" y="150" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">freies Bein</text>
  <text x="122" y="160" fill="#d29922" font-family="system-ui,sans-serif" font-size="8">ohne Bodenkontakt</text>

  <!-- Divider -->
  <line x1="185" y1="35" x2="185" y2="185" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="185" y="200" text-anchor="middle" fill="#30363d" font-family="system-ui,sans-serif" font-size="9">→</text>

  <!-- === RIGHT: JUMP PHASE === -->
  <text x="262" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" font-weight="600">ABSPRUNG &amp; FLUG</text>

  <!-- Jump arrow -->
  <line x1="232" y1="170" x2="232" y2="62" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ce-up)"/>

  <!-- Airborne figure (one leg extended, one tucked) -->
  <circle cx="264" cy="72" r="8" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="264" y1="80" x2="264" y2="110" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms on hips -->
  <line x1="252" y1="92" x2="264" y2="90" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="264" y1="90" x2="276" y2="92" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="264" cy="110" r="3" fill="#3fb950"/>
  <!-- Jump leg extended -->
  <line x1="264" y1="110" x2="260" y2="135" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="135" x2="258" y2="155" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Free leg tucked -->
  <line x1="264" y1="110" x2="278" y2="124" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>
  <line x1="278" y1="124" x2="282" y2="140" stroke="#d29922" stroke-width="3" stroke-linecap="round"/>

  <!-- Landing mark for jump leg -->
  <rect x="248" y="171" width="34" height="8" rx="2" fill="#0d2b3b"/>
  <text x="265" y="192" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="8">Landemarke Sprungbein</text>

  <!-- Height bracket -->
  <line x1="310" y1="175" x2="310" y2="68" stroke="#8b949e" stroke-width="1" marker-start="url(#ce-l)" marker-end="url(#ce-r)"/>
  <text x="325" y="118" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Höhe</text>
  <text x="325" y="129" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">[cm]</text>

  <!-- Footer -->
  <rect x="10" y="204" width="340" height="14" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="180" y="214" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Je Seite 3 Versuche · Landung auf dem Sprungbein · Asymmetrie &gt; 10 % = trainingsrelevant</text>
</svg>
