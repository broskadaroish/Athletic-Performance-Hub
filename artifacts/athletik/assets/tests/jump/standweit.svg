<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220"
     style="width:100%;max-width:360px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Standweitsprung: Absprunglinie, horizontaler Sprung, Messung bis hinterste Ferse">
  <rect width="360" height="220" rx="8" fill="#161b22"/>
  <text x="180" y="16" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Standweitsprung — Horizontale Explosivkraft</text>

  <defs>
    <marker id="sw-r" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#3fb950"/>
    </marker>
    <marker id="sw-l" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <polygon points="0 0,7 2.5,0 5" fill="#3fb950"/>
    </marker>
    <marker id="sw-r2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#8b949e"/>
    </marker>
    <marker id="sw-l2" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <polygon points="0 0,7 2.5,0 5" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Ground -->
  <line x1="25" y1="172" x2="335" y2="172" stroke="#30363d" stroke-width="2"/>
  <!-- Ground hatch marks -->
  <line x1="30" y1="172" x2="25" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="50" y1="172" x2="45" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="70" y1="172" x2="65" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="220" y1="172" x2="215" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="240" y1="172" x2="235" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="260" y1="172" x2="255" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="280" y1="172" x2="275" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="300" y1="172" x2="295" y2="178" stroke="#30363d" stroke-width="1"/>
  <line x1="320" y1="172" x2="315" y2="178" stroke="#30363d" stroke-width="1"/>

  <!-- Absprunglinie (vertical) -->
  <line x1="78" y1="145" x2="78" y2="178" stroke="#d29922" stroke-width="2.5"/>
  <text x="78" y="140" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Absprung-</text>
  <text x="78" y="150" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9" font-weight="600">linie</text>

  <!-- === TAKEOFF FIGURE (at absprunglinie) === -->
  <!-- Head -->
  <circle cx="78" cy="95" r="8" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Torso leaning forward -->
  <line x1="78" y1="103" x2="84" y2="128" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms forward-swinging -->
  <line x1="68" y1="112" x2="78" y2="110" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="110" x2="96" y2="105" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hip -->
  <circle cx="84" cy="128" r="3" fill="#58a6ff"/>
  <!-- Both legs at takeoff (together, slightly bent) -->
  <line x1="84" y1="128" x2="80" y2="155" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="128" x2="88" y2="155" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Feet on line -->
  <line x1="72" y1="172" x2="85" y2="172" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="83" y1="172" x2="96" y2="172" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Flight arc (parabola) -->
  <path d="M 82,165 Q 180,55 278,165" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- === LANDING FIGURE === -->
  <circle cx="280" cy="110" r="8" fill="none" stroke="#3fb950" stroke-width="2.5"/>
  <!-- Torso -->
  <line x1="280" y1="118" x2="278" y2="143" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms forward balance -->
  <line x1="268" y1="126" x2="278" y2="124" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="278" y1="124" x2="296" y2="120" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hip -->
  <circle cx="278" cy="143" r="3" fill="#3fb950"/>
  <!-- Legs bent on landing -->
  <line x1="278" y1="143" x2="270" y2="163" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <line x1="278" y1="143" x2="288" y2="163" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Shins -->
  <line x1="270" y1="163" x2="265" y2="172" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <line x1="288" y1="163" x2="290" y2="172" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>

  <!-- Landing mark (hinterste Ferse) -->
  <line x1="260" y1="172" x2="260" y2="182" stroke="#f85149" stroke-width="2.5"/>
  <text x="260" y="193" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="8">hinterste</text>
  <text x="260" y="202" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="8">Ferse</text>

  <!-- Measurement arrow -->
  <line x1="78" y1="185" x2="260" y2="185" stroke="#3fb950" stroke-width="1.5" marker-start="url(#sw-l)" marker-end="url(#sw-r)"/>
  <rect x="135" y="183" width="52" height="12" rx="2" fill="#161b22"/>
  <text x="161" y="192" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Weite [cm]</text>

  <!-- "Beide Beine" label -->
  <rect x="30" y="32" width="90" height="22" rx="4" fill="#21262d" opacity="0.9"/>
  <text x="75" y="44" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9" font-weight="600">beide Beine gleichzeitig</text>
  <text x="75" y="52" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Arme mitnutzen erlaubt</text>

  <!-- Footer -->
  <rect x="10" y="206" width="340" height="12" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="180" y="215" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">3 Versuche · beste Weite werten · Messung bis hinterste Ferse bei der Landung</text>
</svg>
