<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200"
     style="width:100%;max-width:360px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Seitstütz lateral: Körper seitlich in gerader Linie auf dem Unterarm, rechts und links testen">
  <rect width="360" height="200" rx="8" fill="#161b22"/>
  <text x="180" y="16" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Rumpfkraft lateral — Seitstütz (Side Plank)</text>

  <!-- Ground -->
  <line x1="30" y1="150" x2="330" y2="150" stroke="#30363d" stroke-width="2"/>

  <!-- Straight-line reference -->
  <line x1="96" y1="86" x2="288" y2="128" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="200" y="80" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">Schulter–Hüfte–Fuß in einer Linie</text>

  <!-- Head -->
  <circle cx="88" cy="82" r="8" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Torso (elevated, side position) -->
  <line x1="96" y1="88" x2="186" y2="108" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Support arm: upper arm down, forearm flat -->
  <line x1="108" y1="91" x2="112" y2="148" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="148" x2="146" y2="150" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top arm resting on hip -->
  <line x1="130" y1="96" x2="150" y2="88" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hip (elevated) -->
  <circle cx="186" cy="108" r="3" fill="#58a6ff"/>
  <!-- Legs stacked, straight -->
  <line x1="186" y1="108" x2="240" y2="120" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="120" x2="288" y2="128" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Foot edge on ground -->
  <line x1="288" y1="128" x2="292" y2="150" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <text x="292" y="166" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Füße gestapelt</text>

  <!-- Hip elevation arrow / cue -->
  <rect x="196" y="126" width="96" height="16" rx="3" fill="#3b0d0d" opacity="0.9"/>
  <text x="244" y="137" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="8" font-weight="600">✕ Hüfte sinkt ab = Testende</text>

  <!-- R/L note -->
  <rect x="36" y="34" width="118" height="24" rx="4" fill="#21262d" opacity="0.9"/>
  <text x="95" y="45" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Rechts UND Links testen</text>
  <text x="95" y="54" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Seitendifferenz &gt; 10 % = auffällig</text>

  <!-- Stopwatch -->
  <circle cx="318" cy="52" r="13" fill="none" stroke="#8b949e" stroke-width="2"/>
  <line x1="318" y1="52" x2="318" y2="44" stroke="#8b949e" stroke-width="2"/>
  <line x1="318" y1="52" x2="324" y2="54" stroke="#8b949e" stroke-width="2"/>
  <text x="318" y="76" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Zeit [s]</text>

  <!-- Footer -->
  <rect x="10" y="182" width="340" height="14" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="180" y="192" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Ellbogen unter der Schulter · je Seite 1 Versuch · Haltedauer in Sekunden</text>
</svg>
