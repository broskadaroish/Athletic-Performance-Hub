<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220"
     style="width:100%;max-width:360px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Bankdrücken: Seitenansicht auf der Bank, Langhantel über der Brust, Spotter zur Sicherung">
  <rect width="360" height="220" rx="8" fill="#161b22"/>
  <text x="180" y="16" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Bankdrücken — 1RM / Epley-Schätzung</text>

  <defs>
    <marker id="bd-up" markerWidth="7" markerHeight="6" refX="3.5" refY="0" orient="auto">
      <polygon points="0,6 3.5,0 7,6" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Ground -->
  <line x1="30" y1="185" x2="330" y2="185" stroke="#30363d" stroke-width="2"/>

  <!-- Bench -->
  <rect x="80" y="126" width="160" height="12" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <line x1="100" y1="138" x2="100" y2="185" stroke="#30363d" stroke-width="3"/>
  <line x1="220" y1="138" x2="220" y2="185" stroke="#30363d" stroke-width="3"/>

  <!-- Athlete lying on bench (side view) -->
  <!-- Head (left end) -->
  <circle cx="102" cy="116" r="8" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Torso -->
  <line x1="110" y1="120" x2="176" y2="122" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Hip -->
  <circle cx="176" cy="122" r="3" fill="#58a6ff"/>
  <!-- Thigh up-forward, shin down to ground (feet flat) -->
  <line x1="176" y1="122" x2="212" y2="140" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="140" x2="216" y2="185" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="185" x2="228" y2="185" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms pressing up -->
  <line x1="128" y1="120" x2="132" y2="92" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Barbell -->
  <line x1="92" y1="88" x2="176" y2="88" stroke="#f0883e" stroke-width="4" stroke-linecap="round"/>
  <rect x="88" y="76" width="9" height="24" rx="2" fill="#f0883e"/>
  <rect x="170" y="76" width="9" height="24" rx="2" fill="#f0883e"/>

  <!-- Press direction arrow -->
  <line x1="132" y1="72" x2="132" y2="46" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#bd-up)"/>
  <text x="146" y="56" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">volle Streckung</text>

  <!-- Spotter figure (right, standing) -->
  <circle cx="286" cy="82" r="7" fill="none" stroke="#d29922" stroke-width="2.2"/>
  <line x1="286" y1="89" x2="286" y2="128" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="286" y1="98" x2="268" y2="92" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
  <line x1="286" y1="98" x2="270" y2="106" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
  <line x1="286" y1="128" x2="278" y2="158" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="278" y1="158" x2="276" y2="185" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="286" y1="128" x2="294" y2="158" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="294" y1="158" x2="296" y2="185" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <text x="286" y="68" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Spotter</text>

  <!-- Cue box -->
  <rect x="30" y="34" width="130" height="24" rx="4" fill="#21262d" opacity="0.9"/>
  <text x="95" y="45" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Füße fest am Boden</text>
  <text x="95" y="54" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Hantel bis Brust · kontrolliert drücken</text>

  <!-- Footer -->
  <rect x="10" y="204" width="340" height="14" rx="3" fill="#21262d" opacity="0.8"/>
  <text x="180" y="214" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">Direkter 1RM nur mit 2 Spottern · Epley: 1RM = Gewicht × (1 + WH/30), 2–10 WH</text>
</svg>
