<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220"
     style="width:100%;max-width:480px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Y-Balance-Test Aufbau: Standfläche mit drei Messarmen Anterior, Posteromedial und Posterolateral">
  <rect width="480" height="220" rx="8" fill="#161b22"/>
  <text x="240" y="22" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Y-Balance-Test — Testaufbau</text>

  <!-- Center: Standfläche -->
  <circle cx="240" cy="120" r="18" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="240" y="124" text-anchor="middle" fill="#58a6ff" font-family="system-ui,sans-serif" font-size="10" font-weight="600">STAND</text>

  <!-- Anterior arm (straight up = forward) -->
  <defs>
    <marker id="arr-yb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
    <marker id="arr-pm" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f0883e"/>
    </marker>
    <marker id="arr-pl" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a371f7"/>
    </marker>
  </defs>

  <!-- Anterior: straight up -->
  <line x1="240" y1="100" x2="240" y2="32" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-yb)"/>
  <text x="240" y="26" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ANTERIOR</text>

  <!-- Posteromedial: lower-left (225°) -->
  <!-- sin(225°)= -0.707, cos(225°)= -0.707  → from center go left-down -->
  <!-- actual visual: left side goes back-inner -->
  <line x1="225" y1="134" x2="96" y2="192" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-pm)"/>
  <text x="60" y="208" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="11" font-weight="700">POSTERO-</text>
  <text x="60" y="218" text-anchor="middle" fill="#f0883e" font-family="system-ui,sans-serif" font-size="11" font-weight="700">MEDIAL</text>

  <!-- Posterolateral: lower-right (135°) -->
  <line x1="255" y1="134" x2="384" y2="192" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-pl)"/>
  <text x="420" y="208" text-anchor="middle" fill="#a371f7" font-family="system-ui,sans-serif" font-size="11" font-weight="700">POSTERO-</text>
  <text x="420" y="218" text-anchor="middle" fill="#a371f7" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LATERAL</text>

  <!-- Distance tick marks on anterior arm -->
  <line x1="236" y1="85" x2="244" y2="85" stroke="#3fb950" stroke-width="1" opacity="0.6"/>
  <line x1="236" y1="65" x2="244" y2="65" stroke="#3fb950" stroke-width="1" opacity="0.6"/>
  <line x1="236" y1="45" x2="244" y2="45" stroke="#3fb950" stroke-width="1" opacity="0.6"/>

  <!-- Labels for both feet -->
  <text x="200" y="116" text-anchor="end" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Beinlänge</text>
  <text x="200" y="127" text-anchor="end" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">messen!</text>

  <!-- Legend -->
  <rect x="136" y="148" width="208" height="46" rx="4" fill="#21262d" opacity="0.8"/>
  <line x1="148" y1="161" x2="168" y2="161" stroke="#3fb950" stroke-width="2"/>
  <text x="172" y="164" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Anterior (0°)</text>
  <line x1="148" y1="175" x2="168" y2="175" stroke="#f0883e" stroke-width="2"/>
  <text x="172" y="178" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Posteromedial (~135°)</text>
  <line x1="148" y1="189" x2="168" y2="189" stroke="#a371f7" stroke-width="2"/>
  <text x="172" y="192" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Posterolateral (~225°)</text>
</svg>
