<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190"
     style="width:100%;max-width:620px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Sprint-Testaufbau: Start bis 30 Meter mit Markierungen bei 5, 10, 20 und 30 Metern">

  <!-- Hintergrund -->
  <rect width="620" height="190" rx="8" fill="#161b22"/>

  <!-- Titel -->
  <text x="310" y="24" text-anchor="middle" fill="#c9d1d9"
        font-family="system-ui,sans-serif" font-size="13" font-weight="600">
    Sprint-Testaufbau — 5 / 10 / 20 / 30 m
  </text>

  <!-- Laufbahn -->
  <rect x="44" y="50" width="532" height="72" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <!-- Spurlinien -->
  <line x1="44" y1="68"  x2="576" y2="68"  stroke="#30363d" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="44" y1="104" x2="576" y2="104" stroke="#30363d" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Laufrichtungs-Pfeil -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" opacity="0.5"/>
    </marker>
  </defs>
  <line x1="60" y1="86" x2="566" y2="86"
        stroke="#58a6ff" stroke-width="1.5" opacity="0.35" marker-end="url(#arr)"/>

  <!-- ── Athleten-Silhouette (Start) ── -->
  <circle cx="34" cy="62" r="6" fill="#58a6ff" opacity="0.85"/>
  <line x1="34" y1="68" x2="34" y2="88" stroke="#58a6ff" stroke-width="2.5" opacity="0.85"/>
  <line x1="27" y1="75" x2="41" y2="75" stroke="#58a6ff" stroke-width="2"   opacity="0.85"/>
  <line x1="34" y1="88" x2="28" y2="104" stroke="#58a6ff" stroke-width="2"  opacity="0.85"/>
  <line x1="34" y1="88" x2="40" y2="104" stroke="#58a6ff" stroke-width="2"  opacity="0.85"/>

  <!-- ════════════════════════════════════════════════════════
       Startlinie  x=44
       ════════════════════════════════════════════════════════ -->
  <line x1="44" y1="44" x2="44" y2="128" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="44" y="143" text-anchor="middle" fill="#58a6ff"
        font-family="system-ui,sans-serif" font-size="11" font-weight="700">Start</text>

  <!-- ════════════════════════════════════════════════════════
       5-m-Markierung  x=44 + 5*(532/30) = 44 + 88.7 = 133
       ════════════════════════════════════════════════════════ -->
  <line x1="133" y1="44" x2="133" y2="128" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- Hütchen oben -->
  <polygon points="133,44  127,56  139,56" fill="#e3b341" opacity="0.9"/>
  <!-- Hütchen unten -->
  <polygon points="133,128 127,116 139,116" fill="#e3b341" opacity="0.9"/>
  <text x="133" y="143" text-anchor="middle" fill="#e3b341"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600">5 m</text>

  <!-- ════════════════════════════════════════════════════════
       10-m-Markierung  x=44 + 10*(532/30) = 44 + 177.3 = 221
       ════════════════════════════════════════════════════════ -->
  <line x1="221" y1="44" x2="221" y2="128" stroke="#f0883e" stroke-width="2"/>
  <!-- Zeitmesstor oben -->
  <rect x="217" y="43" width="8" height="12" rx="2" fill="#f0883e"/>
  <line x1="221" y1="55" x2="221" y2="44" stroke="#f0883e" stroke-width="1"/>
  <!-- Zeitmesstor unten -->
  <rect x="217" y="117" width="8" height="12" rx="2" fill="#f0883e"/>
  <!-- Lichtschranken-Strahl -->
  <line x1="221" y1="50" x2="221" y2="122" stroke="#f0883e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="221" y="143" text-anchor="middle" fill="#f0883e"
        font-family="system-ui,sans-serif" font-size="11" font-weight="700">10 m</text>

  <!-- ════════════════════════════════════════════════════════
       20-m-Markierung  x=44 + 20*(532/30) = 44 + 354.7 = 399
       ════════════════════════════════════════════════════════ -->
  <line x1="399" y1="44" x2="399" y2="128" stroke="#3fb950" stroke-width="2"/>
  <rect x="395" y="43" width="8" height="12" rx="2" fill="#3fb950"/>
  <rect x="395" y="117" width="8" height="12" rx="2" fill="#3fb950"/>
  <line x1="399" y1="50" x2="399" y2="122" stroke="#3fb950" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="399" y="143" text-anchor="middle" fill="#3fb950"
        font-family="system-ui,sans-serif" font-size="11" font-weight="700">20 m</text>

  <!-- ════════════════════════════════════════════════════════
       30-m-Markierung  x=44 + 30*(532/30) = 576
       ════════════════════════════════════════════════════════ -->
  <line x1="576" y1="44" x2="576" y2="128" stroke="#ff7b72" stroke-width="2"/>
  <rect x="572" y="43" width="8" height="12" rx="2" fill="#ff7b72"/>
  <rect x="572" y="117" width="8" height="12" rx="2" fill="#ff7b72"/>
  <line x1="576" y1="50" x2="576" y2="122" stroke="#ff7b72" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="576" y="143" text-anchor="middle" fill="#ff7b72"
        font-family="system-ui,sans-serif" font-size="11" font-weight="700">30 m</text>

  <!-- ── Legende ─────────────────────────────────────────────────────── -->
  <rect x="44" y="158" width="530" height="26" rx="4" fill="#21262d" opacity="0.7"/>

  <!-- Hütchen-Symbol -->
  <polygon points="79,170  74,178  84,178" fill="#e3b341"/>
  <text x="88" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Hütchen (5 m)</text>

  <!-- Zeitmesstor-Symbol -->
  <rect x="186" y="164" width="6" height="10" rx="1" fill="#f0883e"/>
  <text x="196" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Zeitmesstor / Lichtschranke</text>

  <!-- Laufrichtungs-Symbol -->
  <line x1="360" y1="171" x2="390" y2="171" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" marker-end="url(#arr)"/>
  <text x="394" y="177" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Laufrichtung</text>

  <!-- Auslauffläche-Hinweis -->
  <text x="576" y="160" text-anchor="middle" fill="#8b949e"
        font-family="system-ui,sans-serif" font-size="9">+10 m</text>
  <text x="576" y="170" text-anchor="middle" fill="#8b949e"
        font-family="system-ui,sans-serif" font-size="9">Auslauf</text>

</svg>
