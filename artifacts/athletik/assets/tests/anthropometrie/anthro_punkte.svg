<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"
     style="width:100%;max-width:400px;border-radius:8px;display:block;margin:0 auto"
     role="img" aria-label="Anthropometrie Messpunkte: Körpergröße, Sitzhöhe, Beinlänge, Armspann">
  <rect width="400" height="240" rx="8" fill="#161b22"/>
  <text x="200" y="22" text-anchor="middle" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Anthropometrie — Messpunkte</text>

  <!-- Silhouette (simplified) -->
  <!-- Head -->
  <circle cx="160" cy="55" r="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- Body -->
  <line x1="160" y1="71" x2="160" y2="148" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Arms -->
  <line x1="160" y1="90" x2="92"  y2="118" stroke="#58a6ff" stroke-width="2"/>
  <line x1="160" y1="90" x2="228" y2="118" stroke="#58a6ff" stroke-width="2"/>
  <!-- Left leg -->
  <line x1="160" y1="148" x2="148" y2="190" stroke="#58a6ff" stroke-width="2"/>
  <!-- Right leg -->
  <line x1="160" y1="148" x2="172" y2="190" stroke="#58a6ff" stroke-width="2"/>
  <!-- Feet -->
  <line x1="148" y1="190" x2="138" y2="193" stroke="#58a6ff" stroke-width="2"/>
  <line x1="172" y1="190" x2="182" y2="193" stroke="#58a6ff" stroke-width="2"/>

  <!-- Ground line -->
  <line x1="100" y1="195" x2="220" y2="195" stroke="#30363d" stroke-width="1.5"/>

  <!-- Measurement: Körpergröße (full height) -->
  <line x1="240" y1="40" x2="240" y2="195" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="235" y1="40"  x2="245" y2="40"  stroke="#3fb950" stroke-width="1.5"/>
  <line x1="235" y1="195" x2="245" y2="195" stroke="#3fb950" stroke-width="1.5"/>
  <text x="268" y="116" text-anchor="start" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Größe</text>
  <text x="268" y="128" text-anchor="start" fill="#3fb950" font-family="system-ui,sans-serif" font-size="10">(cm)</text>

  <!-- Measurement: Sitzhöhe (head to seat) — seat at hip ~148 -->
  <line x1="300" y1="40" x2="300" y2="148" stroke="#f0883e" stroke-width="1.5"/>
  <line x1="295" y1="40"  x2="305" y2="40"  stroke="#f0883e" stroke-width="1.5"/>
  <line x1="295" y1="148" x2="305" y2="148" stroke="#f0883e" stroke-width="1.5"/>
  <text x="310" y="88" text-anchor="start" fill="#f0883e" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Sitzhöhe</text>
  <text x="310" y="100" text-anchor="start" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10">(cm)</text>

  <!-- Measurement: Beinlänge (hip to ground) -->
  <line x1="340" y1="148" x2="340" y2="195" stroke="#a371f7" stroke-width="1.5"/>
  <line x1="335" y1="148" x2="345" y2="148" stroke="#a371f7" stroke-width="1.5"/>
  <line x1="335" y1="195" x2="345" y2="195" stroke="#a371f7" stroke-width="1.5"/>
  <text x="350" y="168" text-anchor="start" fill="#a371f7" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Beinlänge</text>
  <text x="350" y="180" text-anchor="start" fill="#a371f7" font-family="system-ui,sans-serif" font-size="10">(cm)</text>

  <!-- Measurement: Armspann (finger to finger) -->
  <line x1="92"  y1="130" x2="228" y2="130" stroke="#d29922" stroke-width="1.5"/>
  <line x1="92"  y1="125" x2="92"  y2="135" stroke="#d29922" stroke-width="1.5"/>
  <line x1="228" y1="125" x2="228" y2="135" stroke="#d29922" stroke-width="1.5"/>
  <text x="160" y="145" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Armspann (cm)</text>

  <!-- BMI note -->
  <text x="34" y="210" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">BMI = Gewicht (kg) / Größe² (m)</text>
  <text x="34" y="222" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">PHV = Mirwald-Formel (Sitzhöhe + Beinlänge erforderlich)</text>
</svg>
