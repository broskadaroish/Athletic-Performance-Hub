<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 430">
  <rect width="340" height="430" fill="#0d1117" rx="10"/>
  <text x="170" y="22" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700" font-family="sans-serif">7-Punkt Hautfaltenmessung</text>
  <text x="170" y="36" text-anchor="middle" fill="#8b949e" font-size="9" font-family="sans-serif">Jackson &amp; Pollock (1978) · rechte Körperseite</text>

  <!-- Body silhouette -->
  <ellipse cx="170" cy="68" rx="24" ry="27" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>
  <path d="M154,90 L146,94 Q130,106 128,128 L126,200 Q126,215 140,218 L200,218 Q214,215 214,200 L212,128 Q210,106 194,94 L186,90 Z" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>
  <path d="M128,128 Q115,135 108,155 L100,195 Q98,205 108,207 L120,204 L126,162 L126,128 Z" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>
  <path d="M212,128 Q225,135 232,155 L240,195 Q242,205 232,207 L220,204 L214,162 L214,128 Z" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>
  <path d="M140,218 L135,310 Q134,320 145,321 L163,321 L168,218 Z" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>
  <path d="M200,218 L205,310 Q206,320 195,321 L177,321 L172,218 Z" fill="#161b22" stroke="#444c56" stroke-width="1.5"/>

  <!-- 1: Brust - diagonal fold, chest -->
  <circle cx="152" cy="136" r="9" fill="#3b82f6"/>
  <text x="152" y="140" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">1</text>
  <line x1="143" y1="133" x2="120" y2="122" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="65" y="118" fill="#79c0ff" font-size="9" font-family="sans-serif" text-anchor="start">① Brust</text>
  <text x="65" y="129" fill="#8b949e" font-size="8" font-family="sans-serif">(diagonal, Achselhöhle</text>
  <text x="65" y="139" fill="#8b949e" font-size="8" font-family="sans-serif"> → Brustwarze)</text>

  <!-- 2: Abdomen - vertical, 2cm navel right -->
  <circle cx="178" cy="175" r="9" fill="#f85149"/>
  <text x="178" y="179" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">2</text>
  <line x1="187" y1="173" x2="215" y2="170" stroke="#f85149" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="218" y="168" fill="#ff7b72" font-size="9" font-family="sans-serif">② Abdomen</text>
  <text x="218" y="179" fill="#8b949e" font-size="8" font-family="sans-serif">(2 cm rechts</text>
  <text x="218" y="189" fill="#8b949e" font-size="8" font-family="sans-serif"> vom Nabel)</text>

  <!-- 3: Suprailiakal -->
  <circle cx="195" cy="198" r="9" fill="#a371f7"/>
  <text x="195" y="202" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">3</text>
  <line x1="204" y1="198" x2="218" y2="200" stroke="#a371f7" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="218" y="198" fill="#c191ff" font-size="9" font-family="sans-serif">③ Suprailiakal</text>
  <text x="218" y="209" fill="#8b949e" font-size="8" font-family="sans-serif">(diagonal, über</text>
  <text x="218" y="219" fill="#8b949e" font-size="8" font-family="sans-serif"> Darmbeinkamm)</text>

  <!-- 4: Oberschenkel - front thigh -->
  <circle cx="152" cy="262" r="9" fill="#3fb950"/>
  <text x="152" y="266" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">4</text>
  <line x1="143" y1="260" x2="120" y2="255" stroke="#3fb950" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="65" y="253" fill="#56d364" font-size="9" font-family="sans-serif" text-anchor="start">④ Oberschenkel</text>
  <text x="65" y="264" fill="#8b949e" font-size="8" font-family="sans-serif">(vordere Mitte,</text>
  <text x="65" y="274" fill="#8b949e" font-size="8" font-family="sans-serif"> Hüfte → Knie)</text>

  <!-- Side view indicator for arm measurements -->
  <text x="170" y="348" text-anchor="middle" fill="#8b949e" font-size="9" font-family="sans-serif">— Rücken / Seite —</text>
  <ellipse cx="82" cy="375" rx="18" ry="22" fill="#161b22" stroke="#444c56" stroke-width="1.2"/>
  <path d="M64,370 Q50,375 56,395 L68,397 L82,375 Z" fill="#161b22" stroke="#444c56" stroke-width="1.2"/>

  <!-- 5: Trizeps - back of upper arm -->
  <circle cx="56" cy="381" r="9" fill="#d29922"/>
  <text x="56" y="385" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">5</text>
  <text x="68" y="380" fill="#e3b341" font-size="9" font-family="sans-serif">⑤ Trizeps</text>
  <text x="68" y="391" fill="#8b949e" font-size="8" font-family="sans-serif">(Rücks. Oberarm)</text>

  <!-- Back torso indicator -->
  <rect x="220" y="356" width="55" height="55" rx="6" fill="#161b22" stroke="#444c56" stroke-width="1.2"/>
  <text x="247" y="370" text-anchor="middle" fill="#8b949e" font-size="8" font-family="sans-serif">Rücken</text>

  <!-- 6: Subskapular -->
  <circle cx="248" cy="385" r="9" fill="#f0883e"/>
  <text x="248" y="389" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">6</text>
  <text x="215" y="384" fill="#ffa657" font-size="9" font-family="sans-serif" text-anchor="end">⑥ Subskapular</text>
  <text x="215" y="395" fill="#8b949e" font-size="8" font-family="sans-serif" text-anchor="end">(unt. Schulterblatt,</text>
  <text x="215" y="405" fill="#8b949e" font-size="8" font-family="sans-serif" text-anchor="end"> 45°-Falte)</text>

  <!-- 7: Midaxillary side -->
  <circle cx="108" cy="375" r="9" fill="#58a6ff"/>
  <text x="108" y="379" text-anchor="middle" fill="white" font-size="9" font-weight="700" font-family="sans-serif">7</text>
  <text x="100" y="368" fill="#79c0ff" font-size="9" font-family="sans-serif" text-anchor="end">⑦ Mittelachse</text>
  <text x="100" y="379" fill="#8b949e" font-size="8" font-family="sans-serif" text-anchor="end">(Seite, Höhe</text>
  <text x="100" y="389" fill="#8b949e" font-size="8" font-family="sans-serif" text-anchor="end"> Xiphoid)</text>

  <text x="170" y="421" text-anchor="middle" fill="#8b949e" font-size="8" font-family="sans-serif">Caliper senkrecht zur Falte · 1 cm neben Fingern ablesen</text>
</svg>
