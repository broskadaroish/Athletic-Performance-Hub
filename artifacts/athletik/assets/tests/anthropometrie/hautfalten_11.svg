  <text x="10" y="408" fill="#8b949e" font-size="8" font-family="sans-serif">Caliper rechtwinklig zur Falte ansetzen · Ablesen nach 2 Sekunden · Alle rechte Körperseite</text>
  <text x="10" y="421" fill="#8b949e" font-size="8" font-family="sans-serif">Formel: Männer %KF = 11,7 × log₁₀(Σ11) − 11,6  |  Frauen: 15,0 × log₁₀(Σ11) − 12,6</text>
