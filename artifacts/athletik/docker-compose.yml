version: "3.9"

# ============================================================
# Athletik App — Docker Compose für VPS / Self-Hosting
#
# Starten:    docker compose up -d
# Stoppen:    docker compose down
# Logs:       docker compose logs -f athletik
#             docker compose logs -f api
# Nur API:    docker compose up -d api
# ============================================================

services:
  # ── Streamlit-Hauptapp ────────────────────────────────────────────────────────
  athletik:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      APP_ENV:           production
      PORT:              "8082"
      LOG_LEVEL:         WARNING
      BEHIND_PROXY:      "1"
      ATHLETIK_DATA_DIR: /data
      ATHLETIK_DB_PATH:  /data/athletik.db
      # App-URL (für Links in E-Mails und Stripe-Redirects)
      APP_BASE_URL:      ${APP_BASE_URL}
      # SMTP-Konfiguration (Werte aus .env-Datei — nie hier eintragen!)
      SMTP_HOST:         ${SMTP_HOST}
      SMTP_PORT:         ${SMTP_PORT}
      SMTP_USERNAME:     ${SMTP_USERNAME}
      SMTP_PASSWORD:     ${SMTP_PASSWORD}
      SMTP_FROM:         ${SMTP_FROM}
      SUPPORT_EMAIL:     ${SUPPORT_EMAIL}
      # Session-Secrets aus .env-Datei
      SESSION_SECRET:    ${SESSION_SECRET}
      SECRET_KEY:        ${SECRET_KEY}
      # Für PostgreSQL (optional):
      # DATABASE_URL:    ${DATABASE_URL}
    volumes:
      # Persistenter Datenspeicher — DB + Uploads + Logs
      - athletik_data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8082/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── API-Server (Express — Stripe-Webhook, Mobile-API) ─────────────────────────
  # Build-Kontext: Monorepo-Wurzel (../../ relativ zu diesem compose-File)
  # Dockerfile:    artifacts/api-server/Dockerfile
  api:
    build:
      context: ../../
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      # Nur auf Loopback binden — Nginx routet /api/ → 127.0.0.1:8083
      - "127.0.0.1:8083:8083"
    environment:
      PORT:                   "8083"
      NODE_ENV:               production
      # Dieselbe SQLite-Datei wie der Streamlit-Service
      ATHLETIK_DB_PATH:       /data/athletik.db
      # Stripe — Werte aus .env-Datei, nie hier eintragen
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET}
      # Stripe Price-IDs — alle 8 Pakete (DE- und EN-Suffix werden beide geprüft)
      STRIPE_PRICE_TRAINER_BASIC_MONAT:    ${STRIPE_PRICE_TRAINER_BASIC_MONAT:-}
      STRIPE_PRICE_TRAINER_BASIC_MONTHLY:  ${STRIPE_PRICE_TRAINER_BASIC_MONTHLY:-}
      STRIPE_PRICE_TRAINER_BASIC_JAHR:     ${STRIPE_PRICE_TRAINER_BASIC_JAHR:-}
      STRIPE_PRICE_TRAINER_BASIC_YEARLY:   ${STRIPE_PRICE_TRAINER_BASIC_YEARLY:-}
      STRIPE_PRICE_TRAINER_PRO_MONAT:      ${STRIPE_PRICE_TRAINER_PRO_MONAT:-}
      STRIPE_PRICE_TRAINER_PRO_MONTHLY:    ${STRIPE_PRICE_TRAINER_PRO_MONTHLY:-}
      STRIPE_PRICE_TRAINER_PRO_JAHR:       ${STRIPE_PRICE_TRAINER_PRO_JAHR:-}
      STRIPE_PRICE_TRAINER_PRO_YEARLY:     ${STRIPE_PRICE_TRAINER_PRO_YEARLY:-}
      STRIPE_PRICE_VEREIN_BASIC_MONAT:     ${STRIPE_PRICE_VEREIN_BASIC_MONAT:-}
      STRIPE_PRICE_VEREIN_BASIC_MONTHLY:   ${STRIPE_PRICE_VEREIN_BASIC_MONTHLY:-}
      STRIPE_PRICE_VEREIN_BASIC_JAHR:      ${STRIPE_PRICE_VEREIN_BASIC_JAHR:-}
      STRIPE_PRICE_VEREIN_BASIC_YEARLY:    ${STRIPE_PRICE_VEREIN_BASIC_YEARLY:-}
      STRIPE_PRICE_VEREIN_PRO_MONAT:       ${STRIPE_PRICE_VEREIN_PRO_MONAT:-}
      STRIPE_PRICE_VEREIN_PRO_MONTHLY:     ${STRIPE_PRICE_VEREIN_PRO_MONTHLY:-}
      STRIPE_PRICE_VEREIN_PRO_JAHR:        ${STRIPE_PRICE_VEREIN_PRO_JAHR:-}
      STRIPE_PRICE_VEREIN_PRO_YEARLY:      ${STRIPE_PRICE_VEREIN_PRO_YEARLY:-}
    volumes:
      # Dieselbe SQLite-Datei — kein zweites Volume, kein Kopieren
      - athletik_data:/data
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8083/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: nginx als Reverse Proxy (SSL-Terminierung)
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf.example:/etc/nginx/conf.d/athletik.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - athletik
  #     - api

volumes:
  athletik_data:
    driver: local
