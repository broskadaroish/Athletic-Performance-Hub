version: "3.9"

# ============================================================
# Athletik App — Docker Compose für VPS / Self-Hosting
#
# Starten:   docker-compose up -d
# Stoppen:   docker-compose down
# Logs:      docker-compose logs -f athletik
# ============================================================

services:
  athletik:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      APP_ENV:           production
      PORT:              "8082"
      LOG_LEVEL:         WARNING
      BEHIND_PROXY:      "1"
      ATHLETIK_DATA_DIR: /data
      ATHLETIK_DB_PATH:  /data/athletik.db
      # App-URL (für Links in E-Mails und Stripe-Redirects)
      APP_BASE_URL:      ${APP_BASE_URL}
      # SMTP-Konfiguration (Werte aus .env-Datei — nie hier eintragen!)
      SMTP_HOST:         ${SMTP_HOST}
      SMTP_PORT:         ${SMTP_PORT}
      SMTP_USERNAME:     ${SMTP_USERNAME}
      SMTP_PASSWORD:     ${SMTP_PASSWORD}
      SMTP_FROM:         ${SMTP_FROM}
      SUPPORT_EMAIL:     ${SUPPORT_EMAIL}
      # Session-Secrets aus .env-Datei
      SESSION_SECRET:    ${SESSION_SECRET}
      SECRET_KEY:        ${SECRET_KEY}
      # Für PostgreSQL (optional):
      # DATABASE_URL:    ${DATABASE_URL}
    volumes:
      # Persistenter Datenspeicher — DB + Uploads + Logs
      - athletik_data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8082/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: nginx als Reverse Proxy (SSL-Terminierung)
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf.example:/etc/nginx/conf.d/athletik.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - athletik

volumes:
  athletik_data:
    driver: local
