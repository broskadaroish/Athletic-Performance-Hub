[server]
headless = true
address = "0.0.0.0"
port = 8082
baseUrlPath = "/app"
enableCORS = false
enableXsrfProtection = false   # Proxy-kompatibel; für direkten HTTPS-Betrieb auf true setzen
maxUploadSize = 10             # MB — für Logo + Spielerbilder ausreichend

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[theme]
# Dark-Theme als Streamlit-Basis — verhindert, dass iOS Safari beim Initialisieren
# kurz den Browser-Default (weiß) zeigt, bevor APP_CSS über st.markdown injiziert wird.
# Streamlit setzt diese Farben als CSS-Variablen noch vor dem ersten JS-Render.
base = "dark"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
primaryColor = "#1f6feb"
